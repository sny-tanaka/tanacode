# Claude Code との互換性の確認。本物の claude をモックの API で動かし、画面・会話ログ・statusLine・フックを
# アプリと同じ読み取りにかける（API キーは使わず、料金もかからない）。
# PR と push では、アプリ本体の通しのテスト（E2E）もカバレッジを測りながら流し、単体テスト・本物の claude のテストと合わせて
# 層ごとに出し、下限（test/coverage-thresholds.json）を下回ったら失敗にする。
# 毎日の定期の確認（と手動の実行）は、その日の最新の Claude Code で確かめる。
# PR と develop・main への push は、動作確認済のバージョン（src/shared/claude-code.ts）で確かめる
# （新しい Claude Code が出ても、関係のない PR が落ちないように。新しい版への追従は、毎日の確認と、それが作る PR で行う）
# - 読み取れなくなっていたら、Issue を立てる
# - 通ったら、動作確認済のバージョン（src/shared/claude-code.ts）をその版に上げる PR を作って、そのままマージする。その版の控えも一緒に入れる。マージしたらブランチは消す
# 途中の画面などの控えは artifact にも残す
# アプリは macOS 専用なので、macOS のランナーで確かめる（Claude Code は OS で画面の描き方が違う。応答の印は macOS では ⏺、Linux では ●）
name: claude-code-check

on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    # 毎日 6:17（日本時間）
    - cron: '17 21 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 確かめる Claude Code の版（空なら最新）
        required: false

# PR の CI でも動くので、既定は読むだけ。書き込みは、それが要るジョブだけに付ける
permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    permissions:
      contents: read
      issues: write
    outputs:
      version: ${{ steps.claude.outputs.version }}
    env:
      # PR と push では、E2E も流してカバレッジの下限を確かめる。毎日の確認（と手動の実行）は、その日の最新の Claude Code の
      # 互換性を見るものなので流さない（新しい Claude Code での E2E は、動作確認済のバージョンを上げる PR の CI で流れる）
      COVERAGE_GATE: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    steps:
      # PR では、マージ先との差分（変えた行のカバレッジ）を出すため、マージ先の 1 つ前まで取る
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Electron の本体は、E2E を流すときだけ下で入れる
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # 控えで読み取りを確かめる（カバレッジも測る）
      - run: npm run coverage
      - name: Claude Code を入れる
        id: claude
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # 毎日の確認と手動の実行は最新（手動では版を指定できる）。PR と push は動作確認済のバージョン
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            VERSION="${INPUT_VERSION:-latest}"
          else
            VERSION=$(sed -nE "s/^export const VERIFIED_CLAUDE_CODE_VERSION = '([0-9]+\.[0-9]+\.[0-9]+)';$/\1/p" src/shared/claude-code.ts)
            if [ -z "$VERSION" ]; then
              echo "src/shared/claude-code.ts に VERIFIED_CLAUDE_CODE_VERSION が見つかりません"
              exit 1
            fi
          fi
          echo "確かめる Claude Code: $VERSION"
          npm install --no-save --prefix "$RUNNER_TEMP/claude" "@anthropic-ai/claude-code@$VERSION"
          bin="$RUNNER_TEMP/claude/node_modules/.bin/claude"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          echo "version=$("$bin" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" >> "$GITHUB_OUTPUT"
      - name: 本物の claude で確かめる（カバレッジも測る）
        run: npm run coverage:cli
        env:
          TANACODE_CLAUDE_BIN: ${{ steps.claude.outputs.bin }}
          TANACODE_RECORD: 1
      # ここから E2E（PR と push だけ）。Electron の本体は npm ci では入らないので、ここで入れる
      - name: Electron の本体を入れる
        if: env.COVERAGE_GATE == 'true'
        run: node node_modules/electron/install.js
      # E2E で起動するアプリを、ソースマップ付きでビルドする（集めたカバレッジを src の行に戻すのに使う）。
      # 画面側のビルドは、ソースマップを書き出す分も含めてメモリを 5〜6GB ほど使う。Node の既定の上限（約 2GB）では止まるため、
      # 上限を上げる（ci.yml の app のジョブと同じ）。翻訳の補助プログラムは E2E では使わないので作らない
      - name: アプリをソースマップ付きでビルドする
        if: env.COVERAGE_GATE == 'true'
        run: npx electron-vite build
        env:
          TANACODE_SOURCEMAP: 1
          NODE_OPTIONS: --max-old-space-size=6144
      # 動作確認済のバージョンの claude で、画面の操作から Claude Code・MCP・ターミナルまでを通しで確かめる（カバレッジも測る）。
      # パッケージした .app での E2E は、ci.yml の app のジョブで流す
      - name: アプリを画面の操作から通しで確かめる（E2E。カバレッジも測る）
        if: env.COVERAGE_GATE == 'true'
        run: npm run coverage:e2e
        env:
          TANACODE_CLAUDE_BIN: ${{ steps.claude.outputs.bin }}
      # 3 つのカバレッジ（単体・本物の claude・E2E）を合わせて、層ごとの数字をジョブの概要に出す。
      # 下限（test/coverage-thresholds.json）を下回ったら失敗にする。
      # PR の checkout はマージした結果なので、1 つ目の親（HEAD^1）がマージ先。そこからの差分の行のカバレッジも出す
      - name: カバレッジをまとめる
        if: env.COVERAGE_GATE == 'true'
        env:
          DIFF_ARGS: ${{ github.event_name == 'pull_request' && '--diff HEAD^1' || '' }}
        run: npm run coverage:report -- $DIFF_ARGS
      # 画面のボタン・入力のうち、テストが一度も押していないもの（CONTRIBUTING.md の「押していないボタン・入力」）。
      # 1 つでもあれば失敗にする（ボタンや入力を足したら、押すテストも足す）
      - name: テストが押していないボタン・入力が無いか確かめる
        if: env.COVERAGE_GATE == 'true'
        run: npm run coverage:unpressed -- --max 0
      # 落ちた E2E の画面の写し・メインプロセスの出力・モックの API の呼び出し
      - name: E2E の失敗の手がかりを残す
        if: failure() && env.COVERAGE_GATE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/e2e/
          if-no-files-found: ignore
      - name: 控えを残す
        if: always() && steps.claude.outputs.version
        uses: actions/upload-artifact@v4
        with:
          name: claude-code-${{ steps.claude.outputs.version }}
          path: test/fixtures/claude-code/
          if-no-files-found: ignore
      # 同じ版の Issue がもう開いていれば、立てない
      - name: 定期の確認で失敗したら Issue を立てる
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.claude.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Claude Code ${VERSION:-（版が分からない）} で読み取れないところがあります"
          if [ -n "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then exit 0; fi
          gh issue create --title "$title" --body "毎日の互換性の確認（claude-code-check）が失敗しました。

          - 失敗した実行: $RUN_URL
          - 失敗したテストのログに、そのときの Claude Code の画面が出ています
          - 手元では \`TANACODE_CLAUDE_BIN=<claude のパス> npm run test:cli\` で同じ確認ができます"

  # 毎日の確認（と手動の実行）が通ったら、動作確認済のバージョンを上げる PR を作って、PR の CI が通ったらマージする。
  # GitHub Actions のトークン（GITHUB_TOKEN）で作った PR では PR の CI が動かないので、push・PR の作成・マージは GitHub App の token でする
  # （Homebrew の配信と同じ App。App の秘密鍵は Environment「homebrew」にあり、develop で動かしたときだけ使える）。
  # 書き込める権限が要るので、確認とは別のジョブにする（PR のコードを、書き込める権限で動かさない）
  update:
    needs: check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: homebrew
    permissions:
      contents: read
      # PR の CI の実行を探して、終わるのを待つ
      actions: read
    steps:
      - name: PR を作る token を作る
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: sny-tanaka
          repositories: tanacode
          permission-contents: write
          permission-pull-requests: write
      # push も App の token でする（GITHUB_TOKEN で push すると、PR の CI が動かない）
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # 確認のジョブで取った控え
      - uses: actions/download-artifact@v4
        with:
          name: claude-code-${{ needs.check.outputs.version }}
          path: test/fixtures/claude-code/
      # 同じ版の PR が一度でもあれば（閉じたものも）、作り直さない
      - name: 動作確認済のバージョンを上げる PR を作る
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # PR の CI の実行を読む（App の token には Actions の権限を付けていない）
          ACTIONS_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          BASE: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          action=$(node scripts/update-verified-version.mjs "$VERSION")
          echo "することは: $action"
          if [ "$action" = skip ]; then exit 0; fi
          branch="claude-code/$VERSION"
          if [ -n "$(gh pr list --head "$branch" --state all --json number --jq '.[].number')" ]; then
            echo "$branch の PR はもうあります"
            exit 0
          fi
          # 書き換えたあとも、控えで読み取りを確かめる（動作確認済のバージョンの控えがあるかも見る）
          npm test
          if [ "$action" = bump ]; then
            title="chore: 動作確認済の Claude Code を $VERSION にする"
            summary="毎日の互換性の確認が Claude Code $VERSION で通ったので、動作確認済のバージョンを上げます。ステータスバーは、この版と同じならチェックマークを出します。"
          else
            title="test: Claude Code $VERSION の控えを足す"
            summary="動作確認済のバージョン（$VERSION）の控えがまだ無いので、毎日の互換性の確認で取った控えを足します。"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add src/shared/claude-code.ts README.md GUIDE.md "test/fixtures/claude-code/$VERSION"
          git commit -m "$title"
          git push -u origin "$branch"
          gh pr create --base "$BASE" --head "$branch" --title "$title" --body "$summary

          - 確かめた実行: $RUN_URL（\`npm test\` と、本物の claude での \`npm run test:cli\` が通っています）
          - \`test/fixtures/claude-code/$VERSION/\` は、その実行で取った控えです
          - PR の CI が通ったら、そのまま squash マージします
          - マージしたあと、アプリのリリースで利用者に届きます"
          # PR の CI（必須のチェックを出す claude-code-check と demo-site）が動き始めるのを待ってから、終わるまで待つ。
          # 通らなかったときは、マージせずにジョブを失敗させる（PR は開いたまま残るので、人が見て直す）
          for workflow in claude-code-check.yml demo-site.yml; do
            id=''
            for _ in $(seq 30); do
              id=$(GH_TOKEN=$ACTIONS_TOKEN gh run list --workflow "$workflow" --branch "$branch" --event pull_request --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              if [ -n "$id" ]; then break; fi
              sleep 10
            done
            if [ -z "$id" ]; then
              echo "$branch の PR の CI（$workflow）が始まりませんでした。PR を開いて確かめてください"
              exit 1
            fi
            if ! GH_TOKEN=$ACTIONS_TOKEN gh run watch "$id" --exit-status --interval 30 > /dev/null; then
              echo "$branch の PR の CI（$workflow）が通りませんでした: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
              exit 1
            fi
          done
          # 作ったばかりの PR は、マージできるかの判定が終わっていないことがあるので、数回やり直す。
          # マージできなかったときは、ジョブを失敗させる（PR は開いたまま残るので、人が見てマージする）。
          # マージしたらブランチを消す。リポジトリの設定の「ブランチの自動削除」がオンなら GitHub が先に消すので、
          # 消せなくても、もう無ければよい（マージは済んでいるので、ジョブを失敗にしない）。残っていたら警告だけ出す
          for _ in 1 2 3; do
            if gh pr merge "$branch" --squash; then
              if ! git push origin --delete "$branch" 2> /dev/null && [ -n "$(git ls-remote --heads origin "$branch")" ]; then
                echo "::warning::マージしましたが、$branch のブランチを消せませんでした。手で消してください"
              fi
              exit 0
            fi
            sleep 10
          done
          echo "$branch の PR をマージできませんでした。PR を開いて確かめてください"
          exit 1
