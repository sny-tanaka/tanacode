# Claude Code との互換性の毎日の確認。その日の最新の Claude Code を、モックの API で動かし（API キーは使わず、料金もかからない）、
# チャット（stream-json）・ターミナルモードとの切り替え・会話ログ・statusLine・フックを、アプリと同じ部品で確かめる（npm run test:cli）。手動の実行では、確かめるバージョンを指定できる。
# PR では、動作確認済のバージョン（src/shared/claude-code.ts）での同じ確認を、ci.yml の cli のジョブで流す
# （新しい Claude Code が出ても、関係のない PR が落ちないように。新しいバージョンへの追従は、毎日の確認と、それが作る PR で行う）
# - 読み取れなくなっていたら、Issue を立てる
# - 通ったら、動作確認済のバージョン（src/shared/claude-code.ts）をそのバージョンに上げる PR を作って、そのままマージする。そのバージョンの控えも一緒に入れる。マージしたらブランチは消す
# - 行の目録（行の種類とフィールド。test/transcript-inventory.ts）が、動作確認済のバージョンの目録と違えば、PR は作るがマージしない。
#   差分を PR の本文に載せる（人が仕分けてからマージする）。tanacode が使うフィールドが目録から消えていたら、確認が落ちて Issue が立つ
# 会話ログ・statusLine・stream-json の行の控えは artifact にも残す（stream-json の行は、どれも読めるかも確かめる。形が変わったら落ちて Issue が立つ。
# どの台本でも、アプリの知らない種類の行が出たら落ちる）
# アプリは macOS 専用なので、macOS のランナーで確かめる
name: claude-code-check

on:
  schedule:
    # 毎日 6:17（日本時間）
    - cron: '17 21 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 確かめる Claude Code のバージョン（空なら最新）
        required: false

# 既定は読むだけ。書き込みは、それが要るジョブだけに付ける
permissions:
  contents: read

jobs:
  compat:
    runs-on: macos-latest
    permissions:
      contents: read
      issues: write
    outputs:
      version: ${{ steps.claude.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Electron の本体は使わないので落とさない
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # 最新（手動の実行では、指定したバージョン）
      - name: Claude Code を入れる
        id: claude
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-latest}"
          echo "確かめる Claude Code: $VERSION"
          npm install --no-save --prefix "$RUNNER_TEMP/claude" "@anthropic-ai/claude-code@$VERSION"
          bin="$RUNNER_TEMP/claude/node_modules/.bin/claude"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          echo "version=$("$bin" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" >> "$GITHUB_OUTPUT"
      - name: 本物の claude で確かめる
        run: npm run test:cli
        env:
          TANACODE_CLAUDE_BIN: ${{ steps.claude.outputs.bin }}
          TANACODE_RECORD: 1
      # update のジョブと同じ単体テストを、取った控えで流す（動作確認済のバージョンを上げたつもりで、作業ツリーだけを書き換える。
      # このジョブの権限は読むだけのまま）。basic.test.ts が確かめるのはその時点までに届いた stream-json の行で、控えには終わりまでの
      # 行が入る（recorded.test.ts が読む）。statusline.test.ts・context.test.ts は、動作確認済のバージョンの控え（モデル・エフォート・
      # コンテキストの上限）を読む。recorded.test.ts は、tanacode が使うフィールドが、取った目録にあるかも見る。
      # ここで落ちれば Issue が立つ（update のジョブの npm test で初めて落ちると、Issue が立たない）
      - name: 取った控えで単体テストを流す
        env:
          VERSION: ${{ steps.claude.outputs.version }}
        run: node scripts/update-verified-version.mjs "$VERSION" > /dev/null && npm test
      # 次の update のジョブが控えを使う
      - name: 控えを残す
        if: always() && steps.claude.outputs.version
        uses: actions/upload-artifact@v7
        with:
          name: claude-code-${{ steps.claude.outputs.version }}
          path: test/fixtures/claude-code/
          if-no-files-found: ignore
      # 同じバージョンの Issue がもう開いていれば、立てない
      - name: 失敗したら Issue を立てる
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.claude.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Claude Code ${VERSION:-（バージョンが分からない）} で読み取れないところがあります"
          if [ -n "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then exit 0; fi
          gh issue create --title "$title" --body "毎日の互換性の確認（claude-code-check）が失敗しました。

          - 失敗した実行: $RUN_URL
          - 失敗したテストのログに、そのときの Claude Code の標準エラーの末尾が出ています
          - 台本で、アプリの知らない種類の行が出たとき（ClaudeRun の stop）・tanacode が使うフィールドが目録から消えたとき（recorded.test.ts）も落ちます
          - 手元では \`TANACODE_CLAUDE_BIN=<claude のパス> npm run test:cli\` で同じ確認ができます"

  # 毎日の確認（と手動の実行）が通ったら、動作確認済のバージョンを上げる PR を作って、PR の CI が通ったらマージする。
  # GitHub Actions のトークン（GITHUB_TOKEN）で作った PR では PR の CI が動かないので、push・PR の作成・マージは GitHub App の token でする
  # （Homebrew の配信と同じ App。App の秘密鍵は Environment「homebrew」にあり、develop で動かしたときだけ使える）。
  # 書き込める権限が要るので、確認とは別のジョブにする（PR のコードを、書き込める権限で動かさない）
  update:
    needs: compat
    runs-on: ubuntu-latest
    environment: homebrew
    permissions:
      contents: read
      # PR の CI の実行を探して、終わるのを待つ
      actions: read
    steps:
      - name: PR を作る token を作る
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: sny-tanaka
          repositories: tanacode
          permission-contents: write
          permission-pull-requests: write
      # push も App の token でする（GITHUB_TOKEN で push すると、PR の CI が動かない）
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # 確認のジョブで取った控え
      - uses: actions/download-artifact@v8
        with:
          name: claude-code-${{ needs.compat.outputs.version }}
          path: test/fixtures/claude-code/
      # 同じバージョンの PR が一度でもあれば（閉じたものも）、作り直さない
      - name: 動作確認済のバージョンを上げる PR を作る
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # PR の CI の実行を読む（App の token には Actions の権限を付けていない）
          ACTIONS_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.compat.outputs.version }}
          BASE: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 書き換える前の、動作確認済のバージョン（目録を比べる相手）
          verified=$(sed -nE "s/^export const VERIFIED_CLAUDE_CODE_VERSION = '([0-9]+\.[0-9]+\.[0-9]+)';$/\1/p" src/shared/claude-code.ts)
          action=$(node scripts/update-verified-version.mjs "$VERSION")
          echo "することは: $action"
          if [ "$action" = skip ]; then exit 0; fi
          branch="claude-code/$VERSION"
          if [ -n "$(gh pr list --head "$branch" --state all --json number --jq '.[].number')" ]; then
            echo "$branch の PR はもうあります"
            exit 0
          fi
          # 控えだけを足すときは、もうコミットしてある控えは書き換えない（足りないもの（目録など）だけを足す）
          if [ "$action" = fixtures ]; then git checkout HEAD -- "test/fixtures/claude-code/$VERSION" 2> /dev/null || true; fi
          # 書き換えたあとも、控えで読み取りを確かめる（動作確認済のバージョンの控えがあるかも見る）
          npm test
          # 行の目録を、動作確認済のバージョンの目録と比べる（バージョンを上げるときだけ）。差があれば（前の目録が無いときも）、PR は作るがマージしない
          inventory=same
          diff_file="$RUNNER_TEMP/inventory-diff.md"
          if [ "$action" = bump ]; then
            inventory=$(node scripts/inventory-diff.mjs "test/fixtures/claude-code/$verified/inventory.json" "test/fixtures/claude-code/$VERSION/inventory.json" "$diff_file")
            echo "目録は: $inventory"
          fi
          if [ "$action" = bump ]; then
            title="chore: 動作確認済の Claude Code を $VERSION にする"
            summary="毎日の互換性の確認が Claude Code $VERSION で通ったので、動作確認済のバージョンを上げます。ステータスバーは、このバージョンと同じならチェックマークを出します。"
          else
            title="test: Claude Code $VERSION の控えを足す"
            summary="動作確認済のバージョン（$VERSION）の控え（か、その目録）がまだ無いので、毎日の互換性の確認で取った控えを足します。"
          fi
          if [ "$inventory" = changed ]; then
            merge_note="- 行の目録（\`test/fixtures/claude-code/<バージョン>/inventory.json\`）が、動作確認済のバージョン（$verified）と違うので、**自動ではマージしません**。下の差分を仕分けて（tanacode が読むべきもの・意図して捨てるもの・台本の揺れ）、手元の本物の会話ログでも確かめてから（\`TANACODE_CHECK_VERSION=$VERSION npm run check:transcripts\`）、マージしてください（CONTRIBUTING.md の「Claude Code との互換性の確かめ方」）"
          else
            merge_note="- PR の CI が通ったら、そのまま squash マージします。手元の Claude Code がこのバージョンになって数日使ったら、本物の会話ログでも確かめます（\`TANACODE_CHECK_VERSION=$VERSION npm run check:transcripts\`）"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add src/shared/claude-code.ts README.md README.en.md GUIDE.md "test/fixtures/claude-code/$VERSION"
          git commit -m "$title"
          git push -u origin "$branch"
          body="$summary

          - 確かめた実行: $RUN_URL（\`npm test\` と、本物の claude での \`npm run test:cli\` が通っています）
          - \`test/fixtures/claude-code/$VERSION/\` は、その実行で取った控えです
          $merge_note
          - マージしたあと、アプリのリリースで利用者に届きます"
          if [ "$inventory" = changed ]; then
            body="$body

          ## 行の目録の差分（$verified → $VERSION）

          $(cat "$diff_file")"
          fi
          gh pr create --base "$BASE" --head "$branch" --title "$title" --body "$body"
          # 目録に差があれば、PR を開いたままにして終える（人が仕分けてからマージする）
          if [ "$inventory" = changed ]; then
            echo "::warning::行の目録が $verified と違うので、$branch の PR は自動ではマージしません。差分を仕分けてから、手でマージしてください"
            exit 0
          fi
          # PR の CI（必須のチェックを出す ci と demo-site）が動き始めるのを待ってから、終わるまで待つ。
          # 通らなかったときは、マージせずにジョブを失敗させる（PR は開いたまま残るので、人が見て直す）
          for workflow in ci.yml demo-site.yml; do
            id=''
            for _ in $(seq 30); do
              id=$(GH_TOKEN=$ACTIONS_TOKEN gh run list --workflow "$workflow" --branch "$branch" --event pull_request --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              if [ -n "$id" ]; then break; fi
              sleep 10
            done
            if [ -z "$id" ]; then
              echo "$branch の PR の CI（$workflow）が始まりませんでした。PR を開いて確かめてください"
              exit 1
            fi
            if ! GH_TOKEN=$ACTIONS_TOKEN gh run watch "$id" --exit-status --interval 30 > /dev/null; then
              echo "$branch の PR の CI（$workflow）が通りませんでした: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
              exit 1
            fi
          done
          # 作ったばかりの PR は、マージできるかの判定が終わっていないことがあるので、数回やり直す。
          # マージできなかったときは、ジョブを失敗させる（PR は開いたまま残るので、人が見てマージする）。
          # マージしたらブランチを消す。リポジトリの設定の「ブランチの自動削除」がオンなら GitHub が先に消すので、
          # 消せなくても、もう無ければよい（マージは済んでいるので、ジョブを失敗にしない）。残っていたら警告だけ出す
          for _ in 1 2 3; do
            if gh pr merge "$branch" --squash; then
              if ! git push origin --delete "$branch" 2> /dev/null && [ -n "$(git ls-remote --heads origin "$branch")" ]; then
                echo "::warning::マージしましたが、$branch のブランチを消せませんでした。手で消してください"
              fi
              exit 0
            fi
            sleep 10
          done
          echo "$branch の PR をマージできませんでした。PR を開いて確かめてください"
          exit 1
