# デモのサイト（ブラウザで動くデモ）を GitHub Pages に公開する。
# - develop に入ったら、ビルドして公開する
# - PR では、ビルドが通るかだけを確かめる（公開はしない）
# - どちらでも、ツアーが最後まで止まらずに流れるかを確かめる（tour。待ち時間を 0 にしてビルドし、Electron で流す）
# 公開には、リポジトリの Settings → Pages の Source を「GitHub Actions」にしておく
name: demo-site

on:
  push:
    branches: [develop]
    paths:
      - 'src/renderer/**'
      - 'src/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.demo.config.ts'
      - 'scripts/third-party-notices.ts'
      - 'scripts/check-demo-tour.mjs'
      - '.github/workflows/demo-site.yml'
  pull_request:
    paths:
      - 'src/renderer/**'
      - 'src/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.demo.config.ts'
      - 'scripts/third-party-notices.ts'
      - 'scripts/check-demo-tour.mjs'
      - '.github/workflows/demo-site.yml'
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチでは 1 つずつ動かす。PR は新しいものが来たら古いものを取りやめる（公開は途中で止めず、終わるのを待つ）
concurrency:
  group: demo-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Electron の本体は使わないので落とさない
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # 画面側のビルドはメモリを 4GB ほど使う。Node の既定の上限（約 2GB）では止まるため、上限を上げる
      - run: npm run demo:build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo-site

  # ツアーが最後まで流れるか。画面の部品のクラス名や文言を変えると、台本が要素を見つけられずに止まるため。
  # 待ち時間を 0（VITE_DEMO_WAIT=0）にしてビルドするので、数十秒で流れ終わる。公開するものとは分けて demo-check/ に書き出す
  tour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ツアーは Electron の画面の外で流すので、Electron の本体も入れる
      - run: npm ci
      - run: npm run demo:build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VITE_DEMO_WAIT: 0
          DEMO_OUT_DIR: demo-check
      # 画面の外で描いても、Linux では X のディスプレイが要る
      - run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: xvfb-run -a -s "-screen 0 2560x1440x24" npm run demo:check

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, tour]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
