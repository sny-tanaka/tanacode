# デモのサイト（ブラウザで動くデモ）を GitHub Pages に公開する。
# - develop に入ったら、ビルドして公開する
# - PR では公開しない。どこを変えた PR でも動かす
# - PR では、ツアーが最後まで止まらずに流れるかを確かめる（待ち時間を 0 にしてビルドする）。
#   PC（Electron）と、スマホ（iPhone の Safari と同じ WebKit。メモリを食いすぎないかも見る）を、1 回のビルドで並べて流す。
#   develop への push では流さない（develop にはルールセットで PR を通したものしか入らず、その PR で流しているため）
# 公開には、リポジトリの Settings → Pages の Source を「GitHub Actions」にしておく
name: demo-site

on:
  push:
    branches: [develop]
    paths:
      - 'src/renderer/**'
      - 'src/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.demo.config.ts'
      - 'scripts/third-party-notices.ts'
      - 'scripts/check-demo-tour.mjs'
      - 'scripts/check-demo-tour-sp.mjs'
      - 'scripts/demo-tour-evidence.mjs'
      - '.github/workflows/demo-site.yml'
  # build と tour は develop へのマージに必須のチェック。ワークフローが動かないと結果が届かずにマージできないので、PR では絞り込まずに毎回動かす
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチでは 1 つずつ動かす。PR は新しいものが来たら古いものを取りやめる（公開は途中で止めず、終わるのを待つ）
concurrency:
  group: demo-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 公開するもののビルド（develop への push と手動の実行だけ）。
  # PR では、ビルドが通るかは tour のジョブのビルド（待ち時間の倍率のほかは同じ）で分かるので、作らない。
  # build は develop へのマージに必須のチェック。PR で条件によって飛ばしたジョブは、通ったことになる
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Electron の本体は使わないので落とさない
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # 画面側のビルドはメモリを 4GB ほど使う。Node の既定の上限（約 2GB）では止まるため、上限を上げる
      - run: npm run demo:build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo-site

  # ツアーが最後まで流れるか。画面の部品のクラス名や文言を変えると、台本が要素を見つけられずに止まるため。
  # 待ち時間を 0（VITE_DEMO_WAIT=0）にしてビルドするので、数十秒で流れ終わる。公開するものとは分けて demo-check/ に書き出す。
  # 1 回のビルドで、PC（Electron の画面の外）とスマホ（iPhone 13 の画面の大きさ・倍率）を並べて流す。
  # スマホでは、あわせて、ページの処理のメモリが上限を超えないかも見る。iPhone の Safari は、ページの処理がメモリの上限を超えると
  # ページを落として読み込み直す。WebKit は Chromium と描き方が違い、縮めて見せている画面を端末の解像度のまま描いてメモリが膨らむことが
  # あるので（PC のツアーでは気づけない）、Playwright の WebKit で流す
  tour:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # ふだんは 2 分ほど。止まったときに既定の 6 時間待たない
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # PC のツアーは Electron の画面の外で流すので、Electron の本体も入れる
      - run: npm ci
      # apt の取り込みが途中で止まったまま待ち続けないよう、つながりを 30 秒で打ち切って、3 回まで取り直す
      # （playwright install --with-deps の apt が、ミラーからの取り込みの途中で止まったことがある）
      - run: printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-tanacode-retries
      # 画面の外で描いても、Linux では X のディスプレイが要る（下で WebKit を入れるのと apt がぶつからないよう、先に済ませる）
      - run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      # WebKit の依存（apt の .deb。185 個・140MB ほど）は、deps-cache.yml が develop で取り込んでおいたものをキャッシュから戻し、
      # apt のキャッシュ（/var/cache/apt/archives）に置いて、ミラーから落とさずに入れる。ランナーのミラーが極端に遅いことがあり
      # （数十 KB に数秒〜十数秒。#350・#352 の PR）、落とすと 4 分の打ち切りに 2 回とも当たって落ちたため。
      # キーは deps-cache.yml と同じ（ランナーのイメージ・Playwright のバージョンで要るものが変わる）。PR で作ったキャッシュはその PR からしか
      # 読めないので、ここでは戻すだけにする。イメージが変わってまだ作られていないときは、前のイメージのものを戻す（バージョンが同じ .deb は、そのまま使われる。
      # 違うものだけミラーから落とす）
      - id: webkit-apt-key
        run: |
          echo "image=webkit-apt-$ImageOS-" >> "$GITHUB_OUTPUT"
          echo "key=webkit-apt-$ImageOS-$ImageVersion-playwright$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: webkit-apt
        uses: actions/cache/restore@v6
        with:
          path: ~/webkit-apt
          key: ${{ steps.webkit-apt-key.outputs.key }}
          restore-keys: ${{ steps.webkit-apt-key.outputs.image }}
      - name: WebKit の依存の .deb を apt のキャッシュに置く
        env:
          MATCHED: ${{ steps.webkit-apt.outputs.cache-matched-key }}
        run: |
          if ! ls ~/webkit-apt/*.deb > /dev/null 2>&1; then
            echo "::warning::WebKit の依存の .deb のキャッシュがありません。ミラーから落とします（deps-cache.yml が develop で作ります）"
            exit 0
          fi
          sudo cp ~/webkit-apt/*.deb /var/cache/apt/archives/
          echo "$(ls ~/webkit-apt/*.deb | wc -l) 個を置きました（キャッシュ: $MATCHED）"
      # スマホのツアーで使う WebKit は、ビルドと関わりが無いので、ビルドと並べて入れる
      - name: デモのサイトを待ち時間 0 でビルドする（あわせて WebKit を入れる）
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VITE_DEMO_WAIT: 0
          DEMO_OUT_DIR: demo-check
        # 下の打ち切りが効かなかったときも、既定の 30 分（ジョブの上限）まで待たない。ふつうは 1 分ほど
        timeout-minutes: 16
        run: |
          # 入れるのが止まったまま（ダウンロード・apt の待ち）だと何時間も待つので、1 回を 4 分で打ち切って、2 回まで入れ直す
          # （apt の .deb は上でキャッシュから置いてあるので、ミラーから落とすのは、キャッシュに無いもの・バージョンの違うものだけ。
          # それも、先に scripts/prefetch-webkit-deps.sh で、ミラーを替えながら並べて落としておく）。
          # apt の 30 秒の打ち切り（上）でも、取り直しのまま 10 分止まったことがある（2.1.309 の PR。ミラーの取り込みの途中）。
          # 止まり続けたのか、少しずつ届いていたのかを見分けられるよう、出力の各行に時刻を付けて、ファイルに溜めずにステップのログへそのまま出す
          # （取り消されたときも、そこまでが残る。デモのビルドの出力と混ざるので、[WebKit] を付ける）
          stamp() { while IFS= read -r line; do printf '%(%T)T [WebKit] %s\n' -1 "$line"; done; }
          # 打ち切る 1 回。$1 が root なら root で動かす。ステップの bash は -e なので、終了コードは || で受ける。
          # 出力はパイプでなくプロセス置換で stamp に渡し、書き口が閉じるのを待たない（打ち切りで残ったプロセスがあっても、ここで止まらない）
          attempt() {
            local as=$1 status=0
            shift
            if [ "$as" = root ]; then
              sudo env "PATH=$PATH" timeout -k 30 240 "$@" > >(stamp) 2>&1 || status=$?
            else
              timeout -k 30 240 "$@" > >(stamp) 2>&1 || status=$?
            fi
            return "$status"
          }
          install_webkit() {
            local n status
            # キャッシュに無いものを先に落とす（落とせなかったものは apt に任せる）。打ち切りと root で動かすわけは attempt と同じ
            echo "== キャッシュに無い .deb を先に落とす" | stamp
            sudo env "PATH=$PATH" timeout -k 30 240 scripts/prefetch-webkit-deps.sh > >(stamp) 2>&1 || echo "== 先に落とすのは終了コード $?（apt に任せる）" | stamp
            for n in 1 2; do
              echo "== $n 回目を始める" | stamp
              # apt（install-deps）は、timeout ごと root で動かす。利用者の timeout からは root の apt に合図を送れず、sudo も、
              # 同じプロセスのまとまりからの合図は命令に伝えない（届いたとみなす）。打ち切っても apt が残り、ログのパイプを持ち続けて、
              # ステップが 30 分終わらなかった（#327 の最初の CI）。root で動かすと Playwright は sudo を挟まないので、apt も timeout のまとまりに入る
              status=0
              attempt root npx playwright install-deps webkit || status=$?
              if [ "$status" -eq 0 ]; then attempt user npx playwright install webkit || status=$?; fi
              if [ "$status" -eq 0 ]; then
                # 入れ直しで通ったときも、止まったことが隠れないようにする
                if [ "$n" -gt 1 ]; then echo "::warning::WebKit を入れるのが 1 回目で打ち切られ、入れ直しました（ログの [WebKit] の行）"; fi
                return 0
              fi
              echo "== $n 回目は終了コード $status（124 は打ち切り、137 は強制で止めた）" | stamp
              # 打ち切った apt が残した、設定の途中のパッケージを片付けてから入れ直す
              sudo dpkg --configure -a > >(stamp) 2>&1 || true
            done
            return 1
          }
          install_webkit &
          webkit=$!
          npm run demo:build
          if ! wait "$webkit"; then
            echo "::error::WebKit を入れられませんでした（ログの [WebKit] の行）"
            exit 1
          fi
      # 止まったら、そのときの画面の様子を tour-evidence に書き出す（scripts/demo-tour-evidence.mjs）
      - name: ツアーを PC とスマホで並べて流す
        run: |
          xvfb-run -a -s "-screen 0 2560x1440x24" npm run demo:check -- --evidence "$RUNNER_TEMP/tour-evidence/pc" > "$RUNNER_TEMP/tour-pc.log" 2>&1 &
          pc=$!
          npm run demo:check:sp -- --evidence "$RUNNER_TEMP/tour-evidence/sp" > "$RUNNER_TEMP/tour-sp.log" 2>&1 &
          sp=$!
          status=0
          wait "$pc" || status=$?
          echo "::group::PC のツアー"; cat "$RUNNER_TEMP/tour-pc.log"; echo "::endgroup::"
          [ "$status" -eq 0 ] || echo "::error::PC のツアーが最後まで流れませんでした"
          sp_status=0
          wait "$sp" || sp_status=$?
          echo "::group::スマホのツアー"; cat "$RUNNER_TEMP/tour-sp.log"; echo "::endgroup::"
          [ "$sp_status" -eq 0 ] || echo "::error::スマホのツアーが最後まで流れませんでした（メモリの上限を超えたときも）"
          [ "$status" -eq 0 ] && [ "$sp_status" -eq 0 ]
      # ページの処理のプロセスが落ちたときに、OS が落とした理由（メモリが足りずに落とした・不正な番地や命令で落ちた など）を残す。
      # WebKit の出力（webkit.log）には、落ちた理由が出ないことがあるため
      - name: OS の記録を残す
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/tour-evidence"
          sudo dmesg -T 2>/dev/null | tail -n 200 > "$RUNNER_TEMP/tour-evidence/dmesg.txt" || true
      # ツアーがときどき止まるときは、手元で再現しにくい。止まったときの画面の写し・アプリの画面の HTML・画面の様子を残して、原因を見分けられるようにする
      - name: ツアーが止まったときの様子を残す
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tour-evidence
          path: ${{ runner.temp }}/tour-evidence/
          if-no-files-found: ignore
          overwrite: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
