# release.yml が作った Releases の下書きを点検し、説明の先頭に変更点を足して公開する。手動で起動する（workflow_dispatch）。
# gh を使えない環境（Claude Code の cloud のセッション）から、/release の「5. 下書きの点検」と「6. 公開」を行うためのもの。
# 点検で期待と違うものが見つかったら、何も変えずに止める。公開したら、homebrew.yml で Homebrew の tap の cask も新しいバージョンにする
name: release-publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 公開するバージョン（例 1.0.0）
        required: true
      notes:
        description: 説明の先頭（「## ダウンロード」の前）に足す変更点（Markdown）。空なら足さない
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v7
      # 点検・公開・公開の確かめは、手元の /release と同じスクリプトで行う（公開は、点検した下書きの ID とタグ名を指す）
      - name: 下書きを点検して公開する
        run: |
          notes="$RUNNER_TEMP/notes.md"
          printf '%s\n' "$NOTES" > "$notes"
          if [ -n "$NOTES" ]; then
            bash scripts/release-publish.sh "$VERSION" "$notes"
          else
            bash scripts/release-publish.sh "$VERSION"
          fi
  # Homebrew の tap の cask を、公開したバージョンにする（homebrew.yml）
  homebrew:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/homebrew.yml
    with:
      version: ${{ inputs.version }}
