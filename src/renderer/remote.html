<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1: 文字が 16px より小さい入力欄（チャット・ターミナル）に触れると、iOS が勝手に拡大して戻らなくなるのを止める。
         人のピンチでの拡大は、iOS がこの指定を無視するので、引き続きできる -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- ログインの画面（remote-login-page.ts）と同じく default にする（iOS 27 のぼかしの帯を避けるため） -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#111111" />
    <meta name="referrer" content="no-referrer" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>tanacode</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/remote/main.tsx"></script>
  </body>
</html>
